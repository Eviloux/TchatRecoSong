<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1526">
    <script>
      // Applique le thème avant le premier affichage pour éviter un flash de
      // l'autre thème. Clé synchronisée avec src/utils/theme.ts.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('tchatreco:theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8f6fd');
        }
      })();
    </script>
    <meta name="description" content="Propose une chanson à Music Océane et vote pour les recos du tchat.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
    <title>Music Océane – Recos</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
